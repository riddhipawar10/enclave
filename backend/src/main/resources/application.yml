spring:
  application:
    name: enclave-backend

  datasource:
    url: jdbc:postgresql://localhost:5432/enclave_db
    username: enclave_user
    password: enclave_pass
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true
    database-platform: org.hibernate.dialect.PostgreSQLDialect

  data:
    redis:
      host: localhost
      port: 6379

server:
  port: 8080

jwt:
  secret: enclave-development-secret-key-must-be-at-least-32-bytes-long
  access-token-expiry-ms: 900000